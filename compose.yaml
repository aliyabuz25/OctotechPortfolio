name: octotech-site

services:
  octotech-site:
    container_name: octotech-site
    image: drakkarsoftware/octobot:stable
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - octobot-user-data:/octobot/user
      - octobot-logs:/octobot/logs
      - octobot-backtesting:/octobot/backtesting
      - octobot-tentacles:/octobot/tentacles
    networks:
      - octobot-net

volumes:
  octobot-user-data:
  octobot-logs:
  octobot-backtesting:
  octobot-tentacles:

networks:
  octobot-net:
    external: true
    name: octobot-net

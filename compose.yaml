name: octotech-site

services:
  octotech-site:
    container_name: octotech-site
    image: drakkarsoftware/octobot:stable
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    expose:
      - "8000"
    volumes:
      - octobot-user-data:/octobot/user
      - octobot-logs:/octobot/logs
      - octobot-backtesting:/octobot/backtesting
      - octobot-tentacles:/octobot/tentacles
    networks:
      - octobot-net

volumes:
  octobot-user-data:
  octobot-logs:
  octobot-backtesting:
  octobot-tentacles:

networks:
  octobot-net:
    external: true
    name: octobot-net

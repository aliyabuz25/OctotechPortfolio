services:
  octotech-site:
    container_name: octotech-site
    image: drakkarsoftware/octobot:stable
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    expose:
      - "8000"
    volumes:
      - octobot-user-data:/octobot/user
      - octobot-logs:/octobot/logs
      - octobot-backtesting:/octobot/backtesting
      - octobot-tentacles:/octobot/tentacles
    networks:
      - octobot-net
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.octotech-site.rule=Host(`agency2.octotech.az`)"
      - "traefik.http.routers.octotech-site.entrypoints=web,websecure"
      - "traefik.http.routers.octotech-site.priority=100"
      - "traefik.http.routers.octotech-site.tls=true"
      - "traefik.http.services.octotech-site.loadbalancer.server.port=8000"

volumes:
  octobot-user-data:
  octobot-logs:
  octobot-backtesting:
  octobot-tentacles:

networks:
  edge:
    external: true
    name: edge
  octobot-net:
    external: true
    name: octobot-net
